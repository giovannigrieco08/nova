openapi: 3.0.3
info:
  title: Ephemeral Media Storage API
  description: Supabase Storage contracts for view-once media in Global Chat
  version: 1.0.0

servers:
  - url: https://{project-ref}.supabase.co/storage/v1
    description: Supabase Storage API

paths:
  /object/ephemeral-media/{user_id}/{filename}:
    post:
      operationId: uploadEphemeralMedia
      summary: Upload view-once image or video
      description: |
        Uploads a view-once media file to the user's folder.
        Files are automatically deleted after 24 hours or when viewed.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: filename
          in: path
          required: true
          schema:
            type: string
            example: "media_1234567890.webp"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid file type or size exceeded
        '401':
          description: Unauthorized
        '413':
          description: File too large (max 10MB)

    delete:
      operationId: deleteEphemeralMedia
      summary: Delete view-once media after viewing
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File deleted
        '404':
          description: File not found

  /object/sign/ephemeral-media/{path}:
    post:
      operationId: createSignedUrl
      summary: Create signed URL for viewing media
      description: |
        Creates a time-limited signed URL (60 seconds) for viewing media.
        Used when user taps on view-once message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresIn:
                  type: integer
                  default: 60
                  description: URL expiration in seconds
      responses:
        '200':
          description: Signed URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'

components:
  schemas:
    UploadResponse:
      type: object
      properties:
        Key:
          type: string
          description: Full storage path
          example: "ephemeral-media/user-uuid/media_1234567890.webp"
        Id:
          type: string
          format: uuid
          description: Storage object ID

    SignedUrlResponse:
      type: object
      properties:
        signedUrl:
          type: string
          format: uri
          description: Time-limited URL for accessing the file

    BucketConfig:
      type: object
      description: Configuration for ephemeral-media bucket
      properties:
        id:
          type: string
          example: "ephemeral-media"
        name:
          type: string
          example: "ephemeral-media"
        public:
          type: boolean
          example: false
          description: Private bucket, signed URLs required
        file_size_limit:
          type: integer
          example: 10485760
          description: Maximum file size in bytes (10MB)
        allowed_mime_types:
          type: array
          items:
            type: string
          example:
            - "image/jpeg"
            - "image/png"
            - "image/webp"
            - "video/mp4"

---
# Storage Bucket Configuration

## Bucket: `ephemeral-media`

### Properties
- **Public**: `false` (private bucket)
- **File Size Limit**: 10MB (10,485,760 bytes)
- **Allowed MIME Types**:
  - `image/jpeg`
  - `image/png`
  - `image/webp`
  - `video/mp4`

### Folder Structure
```
ephemeral-media/
├── {user_id_1}/
│   ├── media_1234567890.webp
│   └── media_1234567891.mp4
├── {user_id_2}/
│   └── media_1234567892.webp
└── ...
```

### File Naming Convention
```
media_{timestamp_ms}.{extension}
```
Example: `media_1705312200000.webp`

---
# RLS Policies for Storage

## Upload Policy
```sql
CREATE POLICY "Users upload own ephemeral media"
  ON storage.objects FOR INSERT
  TO authenticated
  WITH CHECK (
    bucket_id = 'ephemeral-media'
    AND (storage.foldername(name))[1] = auth.uid()::text
  );
```

## Read Policy
```sql
CREATE POLICY "Users read visible ephemeral media"
  ON storage.objects FOR SELECT
  TO authenticated
  USING (
    bucket_id = 'ephemeral-media'
    AND EXISTS (
      SELECT 1 FROM chat_media cm
      JOIN chat_messages m ON cm.message_id = m.id
      WHERE cm.storage_path = name
        AND m.hidden_at IS NULL
        AND (
          cm.is_viewed = FALSE
          OR cm.uploader_user_id = auth.uid()
        )
    )
  );
```

## Delete Policy
```sql
-- Only system (service role) can delete
-- Deletion happens via Edge Function or pg_cron

CREATE POLICY "Service role deletes ephemeral media"
  ON storage.objects FOR DELETE
  TO service_role
  USING (bucket_id = 'ephemeral-media');
```

