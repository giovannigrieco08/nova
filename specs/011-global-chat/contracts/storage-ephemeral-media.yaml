# Client-Side Implementation

## Upload Flow (Flutter)

```dart
Future<String> uploadViewOnceMedia(File file, ChatMediaType type) async {
  // 1. Compress media
  final compressedFile = await _compressMedia(file, type);

  // 2. Generate filename
  final filename = 'media_${DateTime.now().millisecondsSinceEpoch}.${_getExtension(type)}';
  final path = '${currentUserId}/$filename';

  // 3. Upload to storage
  await supabase.storage
    .from('ephemeral-media')
    .upload(path, compressedFile);

  return path;
}
```

## View Flow (Flutter)

```dart
Future<String> getViewOnceMediaUrl(String storagePath) async {
  // Create signed URL (60s expiry)
  final response = await supabase.storage
    .from('ephemeral-media')
    .createSignedUrl(storagePath, 60);

  return response;
}
```

## Cleanup Flow (Edge Function)

```typescript
// supabase/functions/cleanup-viewed-media/index.ts
import { createClient } from '@supabase/supabase-js'

Deno.serve(async () => {
  const supabase = createClient(
    Deno.env.get('SUPABASE_URL')!,
    Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!
  )

  // Find viewed or expired media
  const { data: mediaToDelete } = await supabase
    .from('chat_media')
    .select('storage_path')
    .or('is_viewed.eq.true,expires_at.lt.now()')

  if (mediaToDelete) {
    const paths = mediaToDelete.map(m => m.storage_path)

    // Delete from storage
    await supabase.storage
      .from('ephemeral-media')
      .remove(paths)

    // Delete from chat_media table
    await supabase
      .from('chat_media')
      .delete()
      .or('is_viewed.eq.true,expires_at.lt.now()')
  }

  return new Response('Cleanup complete')
})
```

