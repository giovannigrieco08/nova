# Daily Limit Enforcement

Users are limited to 5 view-once media per day.

```sql
-- Check daily limit before upload
CREATE OR REPLACE FUNCTION check_media_daily_limit()
RETURNS TRIGGER AS $$
DECLARE
  daily_count INT;
BEGIN
  SELECT COUNT(*) INTO daily_count
  FROM chat_media
  WHERE uploader_user_id = NEW.uploader_user_id
    AND created_at > NOW() - INTERVAL '24 hours';

  IF daily_count >= 5 THEN
    RAISE EXCEPTION 'Daily media limit exceeded: max 5 view-once media per day'
      USING ERRCODE = 'P0003';
  END IF;

  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER check_media_limit_trigger
  BEFORE INSERT ON chat_media
  FOR EACH ROW
  EXECUTE FUNCTION check_media_daily_limit();
```

