# Nova CI/CD Pipeline
# Flutter 3.x + Supabase + Firebase
# Repository: nova_def

name: Nova CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'nova/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'nova/**'

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.29.0'
  JAVA_VERSION: '17'

jobs:
  # =============================================================================
  # JOB 1: Analyze & Format
  # =============================================================================
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nova

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('nova/pubspec.lock') }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            nova/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('nova/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Check for provider duplicates
        run: |
          echo "Checking for duplicate supabaseClientProvider definitions..."
          DUPLICATES=$(grep -r "final supabaseClientProvider = Provider" lib/ --include="*.dart" | wc -l)
          if [ "$DUPLICATES" -gt 1 ]; then
            echo "::warning::Found $DUPLICATES duplicate supabaseClientProvider definitions"
            grep -r "final supabaseClientProvider = Provider" lib/ --include="*.dart"
          fi

  # =============================================================================
  # JOB 2: Test
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze
    defaults:
      run:
        working-directory: nova

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('nova/pubspec.lock') }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            nova/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('nova/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Create test directory if missing
        run: |
          if [ ! -d "test" ]; then
            mkdir -p test
            echo "// Placeholder test file" > test/widget_test.dart
            echo "void main() {}" >> test/widget_test.dart
          fi

      - name: Run tests with coverage
        run: flutter test --coverage || echo "No tests found or tests skipped"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: nova/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # JOB 3: Security Scanning
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: analyze
    defaults:
      run:
        working-directory: nova

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check for outdated dependencies
        run: flutter pub outdated || true

      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./nova
          base: ""
          extra_args: --only-verified

      - name: Check for .env in repository
        run: |
          if [ -f ".env" ] && ! grep -q ".env" .gitignore; then
            echo "::error::.env file found and not in .gitignore!"
            exit 1
          fi
          echo "No .env security issues found"

      - name: SAST - Dart Security Analysis
        run: |
          echo "Checking for insecure patterns..."

          # Check for hardcoded URLs (should use environment variables)
          if grep -r "https://.*supabase" lib/ --include="*.dart" | grep -v "import"; then
            echo "::warning::Hardcoded Supabase URLs found. Use environment variables."
          fi

          # Check for print statements in production code
          PRINTS=$(grep -r "print(" lib/ --include="*.dart" | grep -v "debugPrint" | wc -l)
          if [ "$PRINTS" -gt 0 ]; then
            echo "::warning::Found $PRINTS print() statements. Use debugPrint() instead."
          fi

  # =============================================================================
  # JOB 4: Build Android APK
  # =============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [analyze, test]
    defaults:
      run:
        working-directory: nova

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('nova/pubspec.lock') }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            nova/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('nova/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('nova/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Build APK (Release)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Check APK size
        run: |
          APK_SIZE=$(du -m build/app/outputs/flutter-apk/app-debug.apk | cut -f1)
          echo "APK Size: ${APK_SIZE}MB"
          if [ "$APK_SIZE" -gt 50 ]; then
            echo "::warning::APK size (${APK_SIZE}MB) exceeds 50MB budget!"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk-${{ github.sha }}
          path: nova/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  # =============================================================================
  # JOB 5: Build iOS (Optional - requires macOS runner)
  # =============================================================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [analyze, test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: nova

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            nova/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('nova/pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: nova/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('nova/ios/Podfile.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign

      - name: Check IPA size
        run: |
          IPA_SIZE=$(du -m build/ios/iphoneos/Runner.app | cut -f1)
          echo "IPA Size: ${IPA_SIZE}MB"
          if [ "$IPA_SIZE" -gt 60 ]; then
            echo "::warning::IPA size (${IPA_SIZE}MB) exceeds 60MB budget!"
          fi
