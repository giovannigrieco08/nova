name: nova
description: School Events Platform for Liceo Galilei Moro
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0

  # Design System & UI
  cupertino_native: ^0.1.0  # iOS native UIKit components (requires Xcode 26 beta)
  google_fonts: ^6.1.0      # Inter font for Android (iOS uses SF Pro system font)
  # Removed liquid_glass_renderer: 0.1.1-dev.10 (using BackdropFilter native - design-system v2.0)

  # Supabase Backend
  supabase_flutter: ^2.8.0

  # Deep Linking
  app_links: ^6.3.2

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # SVG Support
  flutter_svg: ^2.0.10

  # Profile Feature Dependencies (002-profile-setup)
  shimmer: ^2.0.0                    # Skeleton loading animations
  image_picker: ^1.0.4               # Camera/gallery access
  image: ^4.0.0                      # Image cropping and manipulation
  hive: ^2.2.3                       # Offline storage
  hive_flutter: ^1.1.0               # Flutter-specific Hive integration
  connectivity_plus: ^5.0.0          # Network status monitoring
  path_provider: ^2.1.1              # File system paths for Hive
  shared_preferences: ^2.2.2         # Persistent key-value storage
  freezed_annotation: ^2.4.0         # Immutable entities annotations
  json_annotation: ^4.8.0            # JSON serialization annotations

  # Events Feed Feature Dependencies (003-events-feed)
  cached_network_image: ^3.3.0       # Progressive image loading with caching
  intl: ^0.19.0                       # Date/time formatting for event details

  # Event Creation & Moderation Feature Dependencies (004-event-creation-moderation)
  firebase_core: ^2.24.0             # Firebase initialization
  firebase_messaging: ^14.7.0        # FCM push notifications
  flutter_image_compress: ^2.1.0     # Client-side image compression (WebP/JPEG)
  share_plus: ^7.2.0                 # Native share sheet for deep links
  # Removed uni_links: ^0.5.1 (deprecated, replaced by app_links ^6.3.2 above)

  # Push Notification Feature Dependencies (008-realtime-notifications)
  flutter_local_notifications: ^17.2.1  # Local notification display

  # Chat Media Feature Dependencies (015-global-chat)
  flutter_sound: ^9.16.0               # Audio recording and playback for voice messages
  permission_handler: ^11.3.1          # Runtime permissions for camera/mic
  # flutter_app_badger: ^1.5.0          # REMOVED: incompatible with AGP 8.0+ (namespace issue)
  uuid: ^4.4.0                          # UUID generation

  # Additional UI/Navigation Dependencies
  go_router: ^14.2.0                    # Declarative routing
  flutter_slidable: ^3.1.0              # Swipe actions for list items
  image_cropper: ^7.0.5                 # Image cropping for avatars
  timeago: ^3.6.0                       # Relative time formatting
  app_settings: ^5.1.1                  # Open device settings

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Code Generation (Profile Feature)
  build_runner: ^2.4.0               # Code generation runner
  hive_generator: ^2.0.0             # Generate Hive type adapters
  freezed: ^2.4.0                    # Generate immutable entities
  json_serializable: ^6.7.0          # Generate JSON serialization code

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - .env  # Environment variables (Supabase credentials)
    - assets/logos/  # Nova logo and branding assets
    - assets/images/  # Event images and other visual content

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
