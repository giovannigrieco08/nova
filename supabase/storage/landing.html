<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apri in Nova</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            padding: 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
            font-weight: bold;
        }
        h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
        .content-box {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .content-title { font-size: 18px; font-weight: 600; color: #1a1a2e; margin-bottom: 8px; }
        .content-desc { font-size: 14px; color: #666; line-height: 1.5; }
        .divider { color: #999; font-size: 12px; margin: 16px 0; }
        .store-buttons { display: flex; gap: 12px; }
        .store-btn {
            flex: 1;
            padding: 14px 8px;
            border-radius: 12px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Loading state */
        .loading-state {
            display: block;
        }
        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Fallback state (app not installed) */
        .fallback-state {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">N</div>

        <!-- Loading: trying to open app -->
        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <h1>Apertura in corso...</h1>
            <p class="subtitle">Stai per essere reindirizzato all'app Nova</p>
        </div>

        <!-- Fallback: app not installed -->
        <div id="fallback" class="fallback-state">
            <h1>Scarica Nova</h1>
            <p class="subtitle">Per visualizzare questo contenuto, installa l'app Nova</p>

            <div class="content-box">
                <div class="content-title" id="title">Contenuto</div>
                <div class="content-desc" id="desc"></div>
            </div>

            <p class="divider">Scarica l'app gratuitamente</p>

            <div class="store-buttons">
                <a class="store-btn" href="https://apps.apple.com/app/nova/id000000000" id="ios-btn">
                    🍎 App Store
                </a>
                <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.galileimoro.nova" id="android-btn">
                    ▶️ Play Store
                </a>
            </div>
        </div>
    </div>

    <script>
        // Parse URL parameters
        var params = new URLSearchParams(window.location.search);
        var title = params.get('title') || 'Contenuto Nova';
        var desc = params.get('desc') || '';
        var deeplink = params.get('deeplink') || 'nova://';

        // Update content
        document.getElementById('title').textContent = title;
        document.getElementById('desc').textContent = desc;
        document.title = title + ' - Nova';

        // Immediately try to open the app
        var appOpened = false;

        // Track if user leaves the page (app opened successfully)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                appOpened = true;
            }
        });

        // Try to open deep link
        window.location.href = deeplink;

        // After 1.5 seconds, if still here, show fallback
        setTimeout(function() {
            if (!appOpened) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('fallback').style.display = 'block';
            }
        }, 1500);
    </script>
</body>
</html>
